<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--framework tailwind-->
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ChatLogin</title>
</head>

<body class="bg-[#111b21] text-white min-h-screen flex flex-col">
    <header class="bg-gray-700 px-4 py-3">
        <nav class="flex items-center justify-between">
            <div class="app flex items-center gap-2"> <!--Não é possível acessar tela de contatos sem login-->
                <img src="img/whatsapp.png" alt="logoWhats" class="w-10 h-10 rounded-full bg-gray-500">
                <span class="text-2xl font-bold text-green-400">Whatsapp</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="">
                    <img src="img/cam.png" alt="camera" class="w-8 h-8">
                </a>
                <a href="">
                    <img src="img/config.png" alt="config" class=" w-8 h-8">
                </a>
                <a href="">
                    <img src="img/sair.png" alt="sair" class="w-8 h-8">
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6">
        <h1 class="text-3xl font-bold mb-6">LOGIN</h1>
        <form action="" class="bg-gray-700 p-6 rounded-xl flex flex-col gap-3 w-80">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" class="bg-gray-500 p-2 rounded outline-none">
            <br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" class="bg-gray-500 p-2 rounded outline-none">
            <br>
            <input type="button" value="Entrar" id="btnEntrar" class="bg-green-500 p-2 rounded font-bold hover:bg-green-400">
        </form>
    </main>

    <footer class="bg-gray-700 p-4 flex items-center gap-3 flex-wrap justify-center">
        <img src="img/IFRNsc_logo.png" alt="logoIF" class="w-16 h-16 bg-white rounded">
        <span class="tituloTrabalho font-bold">Trabalho de Programação para Internet(PPI)</span>
        <span class="prof">Prof. Marcelo Figueiredo Barbosa Júnior</span>
        <a href="telaDevs.html" class="devs text-green-400">
            <span>Área dos desenvolvedores</span>
        </a>
    </footer>
</body>
</html>
